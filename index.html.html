  { n: 28, s: [["Apresentação","Resumo da semana."],["Enquete","Qual look você quer agora?"],["Produto","Peça da semana."],["Dica","Como escolher o tamanho certo."],["Caixa de perguntas","Qual é a sua dúvida?"],["CTA","Chame no direct."]], f: null },
  { n: 29, s: [["Bastidores","Preparação para o fim do mês."],["Enquete","Qual foi o melhor conteúdo do mês?"],["Depoimento","Cliente feliz com a peça (autorizado)."],["Produto","Peça destaque do mês."],["Caixa de perguntas","O que você quer ver em janeiro?"],["CTA","Chame no direct."]], f: null },
  { n: 30, s: [["Retrospectiva","Melhores peças e looks do mês."],["Enquete","Praia ou fitness em janeiro?"],["Agradecimento","Obrigada por acompanhar!"],["Produto","Peça de destaque."],["Caixa de perguntas","Conte o que quer ver mais."],["CTA","Chame no direct para encomendar."]], f: null }
];

function makeStory(tag, text) {
  const t = TIPOS[tag] || TIPOS["Dica"];
  return { tag, text, rec: t.rec, obj: t.obj, visual: t.visual, cta: t.cta, comment: "", links: [] };
}
function makeFeed(f) {
  return { fmt: f[0], tema: f[1], ideia: f[2], roteiro: ROTEIRO[f[0]], legenda: f[3], horario: "19:00", comment: "", links: [] };
}

let days = raw.map(d => ({
  n: d.n,
  note: "",
  s: d.s.map(([tag, text]) => makeStory(tag, text)),
  f: d.f ? makeFeed(d.f) : null
}));
let doneSet = new Set();
let openSet = new Set();
let curDay = 1;

const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const tagClass = tag => "t-" + tag.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "");
const findDay = n => days.find(d => d.n === n);
const getItem = (day, i) => i === "day" ? day : i === "f" ? day.f : day.s[+i];
const dateLabel = n => new Date(2026, 11, n).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
const shortLabel = n => new Date(2026, 11, n).toLocaleDateString("pt-BR", { weekday: "short" });
const weekIndex = n => weeks.findIndex(w => n >= w.ini && n <= w.fim);

function extrasHTML(day, i, item) {
  const links = item.links.map((u, j) =>
    `<span class="chip"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(u.replace(/^https?:\/\//i, "").slice(0, 45))}</a><button class="x" data-act="rmlink" data-d="${day.n}" data-i="${i}" data-j="${j}" title="Remover">✕</button></span>`
  ).join("");
  return `
    <label class="lbl">Comentário</label>
    <textarea class="cmt" data-k="comment" data-d="${day.n}" data-i="${i}" placeholder="Observação ou ajuste">${esc(item.comment)}</textarea>
    <label class="lbl">Links de inspiração</label>
    <div class="links">${links}</div>
    <div class="addlink"><input type="text" placeholder="Cole um link (Instagram, Pinterest...)"><button data-act="addlink" data-d="${day.n}" data-i="${i}">+ Link</button></div>`;
}

function storyHTML(d, j, s) {
  const key = `${d.n}-${j}`;
  const tagOpts = TAGS.map(t => `<option ${t === s.tag ? "selected" : ""}>${t}</option>`).join("");
  const recOpts = RECS.map(r => `<option ${r === s.rec ? "selected" : ""}>${r}</option>`).join("");
  return `<details class="story" data-key="${key}" ${openSet.has(key) ? "open" : ""}>
    <summary>
      <span class="tag ${tagClass(s.tag)}">${esc(s.tag)}</span>
      <span class="stxt">${esc(s.text) || "<em>sem texto</em>"}</span>
      ${s.rec !== "Nenhum" ? `<span class="rec">${esc(s.rec)}</span>` : ""}
    </summary>
    <div class="sbody">
      <div class="grid2">
        <div><label class="lbl">Tipo</label><select data-k="tag" data-d="${d.n}" data-i="${j}">${tagOpts}</select></div>
        <div><label class="lbl">Recurso interativo</label><select data-k="rec" data-d="${d.n}" data-i="${j}">${recOpts}</select></div>
      </div>
      <label class="lbl">Ideia do story</label>
      <input type="text" class="txt" data-k="text" data-d="${d.n}" data-i="${j}" value="${esc(s.text)}">
      <label class="lbl">Objetivo</label>
      <input type="text" class="txt" data-k="obj" data-d="${d.n}" data-i="${j}" value="${esc(s.obj)}">
      <label class="lbl">Visual / roteiro</label>
      <textarea class="cmt" data-k="visual" data-d="${d.n}" data-i="${j}">${esc(s.visual)}</textarea>
      <label class="lbl">Chamada para ação</label>
      <input type="text" class="txt" data-k="cta" data-d="${d.n}" data-i="${j}" value="${esc(s.cta)}">
      ${extrasHTML(d, j, s)}
      <div class="rowend"><span></span><button class="x" data-act="rmstory" data-d="${d.n}" data-i="${j}">Remover story</button></div>
    </div>
  </details>`;
}

function feedHTML(d, f) {
  const fmtOpts = ["Carrossel", "Reel"].map(x => `<option ${x === f.fmt ? "selected" : ""}>${x}</option>`).join("");
  return `<div class="feedbox">
    <div class="grid2">
      <div><label class="lbl">Formato</label><select data-k="fmt" data-d="${d.n}" data-i="f">${fmtOpts}</select></div>
      <div><label class="lbl">Horário sugerido</label><input type="time" data-k="horario" data-d="${d.n}" data-i="f" value="${esc(f.horario)}"></div>
    </div>
    <label class="lbl">Tema</label>
    <input type="text" class="txt" data-k="tema" data-d="${d.n}" data-i="f" value="${esc(f.tema)}">
    <label class="lbl">Ideia principal</label>
    <textarea class="cmt" data-k="ideia" data-d="${d.n}" data-i="f">${esc(f.ideia)}</textarea>
    <label class="lbl">Roteiro (${f.fmt === "Reel" ? "cenas" : "slides"})</label>
    <textarea class="cmt" style="min-height:90px" data-k="roteiro" data-d="${d.n}" data-i="f">${esc(f.roteiro)}</textarea>
    <label class="lbl">Legenda e CTA</label>
    <textarea class="cmt" style="min-height:70px" data-k="legenda" data-d="${d.n}" data-i="f">${esc(f.legenda)}</textarea>
    ${extrasHTML(d, "f", f)}
    <div class="rowend"><span></span><button class="x" data-act="rmfeed" data-d="${d.n}">Remover publicação</button></div>
  </div>`;
}

function renderDay() {
  const d = findDay(curDay);
  const isDone = doneSet.has(d.n);
  const feed = d.f ? feedHTML(d, d.f)
    : `<div class="empty">Sem carrossel ou Reel neste dia. <button class="btn small ghost" data-act="addfeed" data-d="${d.n}">+ Adicionar publicação do feed</button></div>`;
  document.getElementById("day").innerHTML = `<article class="day ${isDone ? "done" : ""}">
    <div class="dayhead">
      <div><h2>${dateLabel(d.n)}</h2><p>${weeks[weekIndex(d.n)].nome} · ${d.s.length} stories${d.f ? " + 1 feed" : ""}</p></div>
      <button class="btn ${isDone ? "" : "ghost"}" data-act="done" data-d="${d.n}">${isDone ? "✓ Dia concluído" : "Marcar dia como concluído"}</button>
    </div>
    <h3 class="sec">Stories</h3>
    <div class="stories">${d.s.map((s, j) => storyHTML(d, j, s)).join("")}</div>
    <button class="btn small ghost" data-act="addstory" data-d="${d.n}">+ Adicionar story</button>
    <h3 class="sec">Feed</h3>
    ${feed}
    <label class="lbl">Observações do dia</label>
    <textarea class="cmt" data-k="note" data-d="${d.n}" data-i="day">${esc(d.note)}</textarea>
  </article>`;
}

function renderWeeks() {
  const cw = weekIndex(curDay);
  document.getElementById("weeks").innerHTML = weeks.map((w, i) =>
    `<button class="wbtn ${i === cw ? "active" : ""}" data-week="${i}">${w.nome} (${w.ini}–${w.fim})</button>`
  ).join("");
}

function renderDays() {
  const w = weeks[weekIndex(curDay)];
  let html = "";
  for (let n = w.ini; n <= w.fim; n++) {
    const d = findDay(n);
    html += `<button class="dbtn ${n === curDay ? "active" : ""} ${doneSet.has(n) ? "done" : ""}" data-day="${n}">
      <span>${shortLabel(n)}</span><b>${n}</b>${d.f ? (d.f.fmt === "Reel" ? "Reel" : "Carrossel") : "&nbsp;"}
    </button>`;
  }
  document.getElementById("days").innerHTML = html;
}

function renderStats() {
  let stories = 0, carrosseis = 0, reels = 0, links = 0;
  days.forEach(d => {
    stories += d.s.length;
    d.s.forEach(s => links += s.links.length);
    if (d.f) { d.f.fmt === "Reel" ? reels++ : carrosseis++; links += d.f.links.length; }
  });
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${doneSet.size}/${days.length}</b>dias concluídos</div>
    <div class="stat"><b>${stories}</b>stories</div>
    <div class="stat"><b>${carrosseis}</b>carrosséis</div>
    <div class="stat"><b>${reels}</b>reels</div>
    <div class="stat"><b>${links}</b>links de inspiração</div>`;
}

function refresh() { renderStats(); renderWeeks(); renderDays(); renderDay(); }

// Edição de campos de texto (sem re-renderizar, para não perder o foco)
const panel = document.getElementById("day");
panel.addEventListener("input", e => {
  const t = e.target;
  if (!t.dataset.k || t.tagName === "SELECT") return;
  const item = getItem(findDay(+t.dataset.d), t.dataset.i);
  if (item) item[t.dataset.k] = t.value;
});

// Selects e campos que mudam estrutura (tipo, recurso, formato)
panel.addEventListener("change", e => {
  const t = e.target;
  if (!t.dataset.k) return;
  const item = getItem(findDay(+t.dataset.d), t.dataset.i);
  if (!item) return;
  item[t.dataset.k] = t.value;
  if (t.tagName === "SELECT") {
    if (t.dataset.k === "tag") {
      // Ao trocar o tipo, aplica os detalhes padrão desse tipo
      const base = TIPOS[t.value] || TIPOS["Dica"];
      Object.assign(item, { rec: base.rec, obj: base.obj, visual: base.visual, cta: base.cta });
    }
    if (t.dataset.k === "fmt") {
      item.roteiro = ROTEIRO[t.value];
    }
    refresh();
  }
});

// Mantém em memória quais stories estão abertos
panel.addEventListener("toggle", e => {
  const key = e.target.dataset && e.target.dataset.key;
  if (!key) return;
  e.target.open ? openSet.add(key) : openSet.delete(key);
}, true);

// Ações
panel.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const day = findDay(+b.dataset.d);
  switch (b.dataset.act) {
    case "done":
      doneSet.has(day.n) ? doneSet.delete(day.n) : doneSet.add(day.n);
      break;
    case "addstory":
      day.s.push(makeStory("Dica", ""));
      openSet.add(`${day.n}-${day.s.length - 1}`);
      break;
    case "rmstory":
      day.s.splice(+b.dataset.i, 1);
      break;
    case "addfeed":
      day.f = makeFeed(["Carrossel", "", "", ""]);
      break;
    case "rmfeed":
      day.f = null;
      break;
    case "addlink": {
      let v = b.previousElementSibling.value.trim();
      if (!v) return;
      if (!/^https?:\/\//i.test(v)) v = "https://" + v;
      getItem(day, b.dataset.i).links.push(v);
      break;
    }
    case "rmlink":
      getItem(day, b.dataset.i).links.splice(+b.dataset.j, 1);
      break;
  }
  refresh();
});

// Navegação por semana e dia
document.getElementById("weeks").addEventListener("click", e => {
  const b = e.target.closest("[data-week]");
  if (!b) return;
  curDay = weeks[+b.dataset.week].ini;
  refresh();
});
document.getElementById("days").addEventListener("click", e => {
  const b = e.target.closest("[data-day]");
  if (!b) return;
  curDay = +b.dataset.day;
  refresh();
});

// Backup: gera e restaura o plano em texto (sem armazenamento do navegador)
const backupTxt = document.getElementById("backupTxt");
const msg = document.getElementById("msg");
document.getElementById("genBtn").addEventListener("click", () => {
  backupTxt.value = JSON.stringify({ plano: "plano-conteudo-dezembro-2026", dias: days, feitos: [...doneSet] });
  msg.textContent = "Backup gerado. Copie o texto e guarde-o.";
});
document.getElementById("restoreBtn").addEventListener("click", () => {
  try {
    const data = JSON.parse(backupTxt.value);
    if (!Array.isArray(data.dias)) throw new Error("formato");
    days = data.dias;
    doneSet = new Set(data.feitos || []);
    openSet = new Set();
    msg.textContent = "Plano restaurado.";
    refresh();
  } catch (err) {
    msg.textContent = "Não foi possível restaurar: cole um backup válido.";
  }
});

refresh();
</script>
</body>
</html>
